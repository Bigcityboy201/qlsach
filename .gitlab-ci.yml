stages:
  - build
  - test
  - deploy

# Quy tắc chung cho toàn bộ Pipeline: Chỉ chạy khi push vào nhánh main
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  MAVEN_CLI_OPTS: "-q --batch-mode --errors --fail-at-end"

cache:
  key: maven-cache
  paths:
    - .m2/repository

build:
  stage: build
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS -DskipTests clean package
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 day

test:
  stage: test
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS test

deploy:
  stage: deploy
  image: node:20
  script:
    - npm i -g @railway/cli
    - echo "Checking environment..."
    # Cách viết này an toàn hơn cho mọi loại Shell
    - |
      if [ -z "$RAILWAY_TOKEN" ]; then
        echo "LỖI: Token đang bị rỗng!"
        exit 1
      fi
    - echo "Deploying to Railway..."
    - RAILWAY_TOKEN=$RAILWAY_TOKEN railway up --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --environment "production" --detach --ci
stages:
  - build
  - test
  - deploy

# Quy tắc chung cho toàn bộ Pipeline: Chỉ chạy khi push vào nhánh main
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  MAVEN_CLI_OPTS: "-q --batch-mode --errors --fail-at-end"

cache:
  key: maven-cache
  paths:
    - .m2/repository

build:
  stage: build
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS -DskipTests clean package
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 day

test:
  stage: test
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS test

deploy:
  stage: deploy
  image: node:20
  variables:
    RAILWAY_TOKEN: $RAILWAY_TOKEN
  script:
    - npm i -g @railway/cli
    - echo "Deploying to Railway..."
    # Lệnh tối giản: Railway sẽ tự tìm Project/Service dựa trên Token
    - railway up --detach --ci
stages:
  - build
  - test
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  MAVEN_CLI_OPTS: "-q --batch-mode --errors --fail-at-end"

cache:
  key: maven-cache
  paths:
    - .m2/repository

build:
  stage: build
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS -DskipTests clean package
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 day

test:
  stage: test
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS test

deploy:
  stage: deploy
  image: node:20-alpine
  variables:
    # Ép Token vào biến môi trường hệ thống của Job
    RAILWAY_TOKEN: $RAILWAY_TOKEN 
  before_script:
    - npm i -g @railway/cli
  script:
    - echo "Checking variables..."
    - test -n "$RAILWAY_TOKEN" || (echo "TOKEN missing" && exit 1)
    
    # Sử dụng lệnh up với flag --ci và --detach
    # Lưu ý: Nếu RAILWAY_ENVIRONMENT_ID của bạn là 'c854...' thì để nguyên, 
    # nhưng tốt nhất nên dùng tên môi trường là 'production'
    railway up --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --detach --ci
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
stages:
  - build
  - test
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  MAVEN_CLI_OPTS: "-q --batch-mode --errors --fail-at-end"

cache:
  key: maven-cache
  paths:
    - .m2/repository

build:
  stage: build
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS -DskipTests clean package
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 day

test:
  stage: test
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS test

deploy:
  stage: deploy
  image: node:20-alpine
  variables:
    # Chỉ định rõ cho Railway biết đây là ứng dụng Java
    RAILWAY_DOCKER_IMAGE_NAME: eclipse-temurin:17-jdk
  script:
    - npm i -g @railway/cli
    - railway status --token "$RAILWAY_TOKEN" --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --detach --verbose
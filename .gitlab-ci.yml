stages:
  - build
  - test
  - deploy

# Quy tắc chung cho toàn bộ Pipeline: Chỉ chạy khi push vào nhánh main
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  MAVEN_CLI_OPTS: "-q --batch-mode --errors --fail-at-end"

cache:
  key: maven-cache
  paths:
    - .m2/repository

build:
  stage: build
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS -DskipTests clean package
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 day

test:
  stage: test
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS test

deploy:
  stage: deploy
  image: node:20-alpine
  variables:
    # Docker sẽ lấy biến này từ GitLab và đưa thẳng vào Environment của Container
    RAILWAY_TOKEN: $RAILWAY_TOKEN
  script:
    # Cài đặt thêm các thư viện cần thiết cho môi trường Docker Alpine
    - apk add --no-cache libc6-compat
    - npm i -g @railway/cli
    
    - echo "Deploying to Railway..."
    # Trong Docker, dùng trực tiếp lệnh up và ép biến RAILWAY_TOKEN
    - railway up --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --detach --ci
services:
  db:
    image: postgres:16
    container_name: book_review_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: book_review_docker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: quangtruong1
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d book_review_docker" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: book_review_app
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
